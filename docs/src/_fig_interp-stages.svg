<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="100%" role="img"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker><marker id="ar2" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#000" stroke-width="1"/></pattern><pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#000"/></pattern></defs><rect x="0" y="0" width="600" height="300" fill="#fff"/><rect x="10" y="20" width="100" height="62" rx="5" fill="#f2f2f2" stroke="#000" stroke-width="1.4"/><text x="60.0" y="47.9" font-family="'Times New Roman', Times, serif" font-size="12" text-anchor="middle"   fill="#000">Text</text><text x="60.0" y="62.5" font-family="'Times New Roman', Times, serif" font-size="12" text-anchor="middle"   fill="#000">&quot;1 + 2 * 3&quot;</text><rect x="130" y="20" width="100" height="62" rx="5" fill="#f2f2f2" stroke="#000" stroke-width="1.4"/><text x="180.0" y="40.6" font-family="'Times New Roman', Times, serif" font-size="12" text-anchor="middle"   fill="#000">Lexer</text><text x="180.0" y="55.2" font-family="'Times New Roman', Times, serif" font-size="12" text-anchor="middle"   fill="#000">cuts into</text><text x="180.0" y="69.8" font-family="'Times New Roman', Times, serif" font-size="12" text-anchor="middle"   fill="#000">tokens</text><rect x="250" y="20" width="100" height="62" rx="5" fill="#f2f2f2" stroke="#000" stroke-width="1.4"/><text x="300.0" y="40.6" font-family="'Times New Roman', Times, serif" font-size="12" text-anchor="middle"   fill="#000">Parser</text><text x="300.0" y="55.2" font-family="'Times New Roman', Times, serif" font-size="12" text-anchor="middle"   fill="#000">builds a</text><text x="300.0" y="69.8" font-family="'Times New Roman', Times, serif" font-size="12" text-anchor="middle"   fill="#000">tree</text><rect x="370" y="20" width="100" height="62" rx="5" fill="#f2f2f2" stroke="#000" stroke-width="1.4"/><text x="420.0" y="40.6" font-family="'Times New Roman', Times, serif" font-size="12" text-anchor="middle"   fill="#000">Evaluator</text><text x="420.0" y="55.2" font-family="'Times New Roman', Times, serif" font-size="12" text-anchor="middle"   fill="#000">walks the</text><text x="420.0" y="69.8" font-family="'Times New Roman', Times, serif" font-size="12" text-anchor="middle"   fill="#000">tree</text><rect x="490" y="20" width="100" height="62" rx="5" fill="#f2f2f2" stroke="#000" stroke-width="1.4"/><text x="540.0" y="47.9" font-family="'Times New Roman', Times, serif" font-size="12" text-anchor="middle"   fill="#000">Answer</text><text x="540.0" y="62.5" font-family="'Times New Roman', Times, serif" font-size="12" text-anchor="middle"   fill="#000">7</text><line x1="110" y1="51" x2="130" y2="51" stroke="#000" stroke-width="1.4" marker-end="url(#ar)"/><line x1="230" y1="51" x2="250" y2="51" stroke="#000" stroke-width="1.4" marker-end="url(#ar)"/><line x1="350" y1="51" x2="370" y2="51" stroke="#000" stroke-width="1.4" marker-end="url(#ar)"/><line x1="470" y1="51" x2="490" y2="51" stroke="#000" stroke-width="1.4" marker-end="url(#ar)"/><text x="180" y="114.2" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="middle"   fill="#000">[1] [+] [2] [*] [3]</text><text x="180" y="131.8" font-family="'Times New Roman', Times, serif" font-size="11" text-anchor="middle"  font-style="italic" fill="#000">tokens</text><circle cx="420" cy="180" r="17" fill="#dcdcdc" stroke="#000" stroke-width="1.4"/><text x="420" y="184.2" font-family="'Times New Roman', Times, serif" font-size="12" text-anchor="middle" font-weight="bold"  fill="#000">+</text><circle cx="370" cy="235" r="15" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="370" y="239.2" font-family="'Times New Roman', Times, serif" font-size="12" text-anchor="middle"   fill="#000">1</text><circle cx="470" cy="235" r="17" fill="#dcdcdc" stroke="#000" stroke-width="1.4"/><text x="470" y="239.2" font-family="'Times New Roman', Times, serif" font-size="12" text-anchor="middle" font-weight="bold"  fill="#000">*</text><circle cx="440" cy="285" r="13" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="440" y="288.9" font-family="'Times New Roman', Times, serif" font-size="11" text-anchor="middle"   fill="#000">2</text><circle cx="500" cy="285" r="13" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="500" y="288.9" font-family="'Times New Roman', Times, serif" font-size="11" text-anchor="middle"   fill="#000">3</text><line x1="408" y1="192" x2="378" y2="223" stroke="#000" stroke-width="1.4"/><line x1="432" y1="192" x2="462" y2="222" stroke="#000" stroke-width="1.4"/><line x1="463" y1="250" x2="445" y2="273" stroke="#000" stroke-width="1.4"/><line x1="477" y1="250" x2="495" y2="273" stroke="#000" stroke-width="1.4"/><text x="160" y="194.6" font-family="'Times New Roman', Times, serif" font-size="12" text-anchor="middle"  font-style="italic" fill="#000">The tree remembers that</text><text x="160" y="209.2" font-family="'Times New Roman', Times, serif" font-size="12" text-anchor="middle"  font-style="italic" fill="#000">multiplication happens</text><text x="160" y="223.8" font-family="'Times New Roman', Times, serif" font-size="12" text-anchor="middle"  font-style="italic" fill="#000">BEFORE addition.</text><text x="160" y="266.2" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="middle"   fill="#000">2 * 3 = 6   then   1 + 6 = 7</text></svg>