<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" width="100%" role="img"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker><marker id="ar2" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#000" stroke-width="1"/></pattern><pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#000"/></pattern></defs><rect x="0" y="0" width="600" height="330" fill="#fff"/><rect x="20" y="20" width="150" height="120" rx="5" fill="#dcdcdc" stroke="#000" stroke-width="1.4"/><text x="95.0" y="62.2" font-family="'Times New Roman', Times, serif" font-size="12" text-anchor="middle"   fill="#000">Call stack</text><text x="95.0" y="76.9" font-family="'Times New Roman', Times, serif" font-size="12" text-anchor="middle"   fill="#000"></text><text x="95.0" y="91.5" font-family="'Times New Roman', Times, serif" font-size="12" text-anchor="middle"   fill="#000">(runs one thing</text><text x="95.0" y="106.2" font-family="'Times New Roman', Times, serif" font-size="12" text-anchor="middle"   fill="#000">at a time)</text><rect x="220" y="20" width="160" height="54" rx="5" fill="#f2f2f2" stroke="#000" stroke-width="1.4"/><text x="300.0" y="43.9" font-family="'Times New Roman', Times, serif" font-size="12" text-anchor="middle"   fill="#000">Web / Node APIs</text><text x="300.0" y="58.5" font-family="'Times New Roman', Times, serif" font-size="12" text-anchor="middle"   fill="#000">timers, files, network</text><rect x="220" y="96" width="160" height="44" rx="5" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="300.0" y="114.9" font-family="'Times New Roman', Times, serif" font-size="12" text-anchor="middle"   fill="#000">Microtask queue</text><text x="300.0" y="129.5" font-family="'Times New Roman', Times, serif" font-size="12" text-anchor="middle"   fill="#000">(Promises)</text><rect x="430" y="20" width="150" height="54" rx="5" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="505.0" y="43.9" font-family="'Times New Roman', Times, serif" font-size="12" text-anchor="middle"   fill="#000">Task queue</text><text x="505.0" y="58.5" font-family="'Times New Roman', Times, serif" font-size="12" text-anchor="middle"   fill="#000">(callbacks, events)</text><rect x="215" y="190" width="170" height="56" rx="5" fill="#bdbdbd" stroke="#000" stroke-width="1.4"/><text x="300.0" y="214.6" font-family="'Times New Roman', Times, serif" font-size="13" text-anchor="middle" font-weight="bold"  fill="#000">EVENT LOOP</text><text x="300.0" y="230.5" font-family="'Times New Roman', Times, serif" font-size="13" text-anchor="middle" font-weight="bold"  fill="#000">&quot;is the stack empty?&quot;</text><line x1="170" y1="50" x2="220" y2="47" stroke="#000" stroke-width="1.4" marker-end="url(#ar)"/><text x="195" y="39.7" font-family="'Times New Roman', Times, serif" font-size="10.5" text-anchor="middle"  font-style="italic" fill="#000">start</text><line x1="380" y1="47" x2="430" y2="47" stroke="#000" stroke-width="1.4" marker-end="url(#ar)"/><text x="405" y="39.7" font-family="'Times New Roman', Times, serif" font-size="10.5" text-anchor="middle"  font-style="italic" fill="#000">done</text><polyline points="505,74 505,218 385,218" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#ar)"/><polyline points="215,218 95,218 95,140" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#ar)"/><line x1="300" y1="140" x2="300" y2="190" stroke="#000" stroke-width="1.4" marker-end="url(#ar)"/><text x="300" y="294.4" font-family="'Times New Roman', Times, serif" font-size="12.5" text-anchor="middle"  font-style="italic" fill="#000">Slow jobs (files, network) are handed away, so the window never freezes.</text><text x="300" y="314.4" font-family="'Times New Roman', Times, serif" font-size="12.5" text-anchor="middle"  font-style="italic" fill="#000">When they finish, their callback waits in a queue for its turn.</text></svg>