<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 230" width="100%" role="img"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker><marker id="ar2" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#000" stroke-width="1"/></pattern><pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#000"/></pattern></defs><rect x="0" y="0" width="600" height="230" fill="#fff"/><line x1="40" y1="70" x2="560" y2="70" stroke="#000" stroke-width="1.4" marker-end="url(#ar)"/><text x="300" y="22.2" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="middle"   fill="#000">{   // start of scope</text><circle cx="80" cy="70" r="7" fill="#000" stroke="#000" stroke-width="1.4"/><rect x="2" y="110" width="156" height="72" rx="5" fill="#f2f2f2" stroke="#000" stroke-width="1.4"/><text x="80.0" y="143.0" font-family="'Times New Roman', Times, serif" font-size="11.5" text-anchor="middle"   fill="#000">File f(&quot;a.txt&quot;);</text><text x="80.0" y="157.0" font-family="'Times New Roman', Times, serif" font-size="11.5" text-anchor="middle"   fill="#000">constructor opens file</text><line x1="80" y1="77" x2="80" y2="110" stroke="#000" stroke-width="1.4"/><circle cx="300" cy="70" r="7" fill="#000" stroke="#000" stroke-width="1.4"/><rect x="222" y="110" width="156" height="72" rx="5" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="300.0" y="136.0" font-family="'Times New Roman', Times, serif" font-size="11.5" text-anchor="middle"   fill="#000">use the file...</text><text x="300.0" y="150.0" font-family="'Times New Roman', Times, serif" font-size="11.5" text-anchor="middle"   fill="#000">anything can happen</text><text x="300.0" y="164.1" font-family="'Times New Roman', Times, serif" font-size="11.5" text-anchor="middle"   fill="#000">(even an error)</text><line x1="300" y1="77" x2="300" y2="110" stroke="#000" stroke-width="1.4"/><circle cx="520" cy="70" r="7" fill="#000" stroke="#000" stroke-width="1.4"/><rect x="442" y="110" width="156" height="72" rx="5" fill="#f2f2f2" stroke="#000" stroke-width="1.4"/><text x="520.0" y="136.0" font-family="'Times New Roman', Times, serif" font-size="11.5" text-anchor="middle"   fill="#000">}  end of scope</text><text x="520.0" y="150.0" font-family="'Times New Roman', Times, serif" font-size="11.5" text-anchor="middle"   fill="#000">destructor closes file</text><text x="520.0" y="164.1" font-family="'Times New Roman', Times, serif" font-size="11.5" text-anchor="middle"   fill="#000">AUTOMATICALLY</text><line x1="520" y1="77" x2="520" y2="110" stroke="#000" stroke-width="1.4"/><text x="300" y="214.4" font-family="'Times New Roman', Times, serif" font-size="12.5" text-anchor="middle" font-weight="bold" font-style="italic" fill="#000">No matter how the block ends, cleanup runs. That is RAII.</text></svg>