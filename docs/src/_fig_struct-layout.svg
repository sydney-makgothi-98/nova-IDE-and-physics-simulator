<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="100%" role="img"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker><marker id="ar2" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#000" stroke-width="1"/></pattern><pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#000"/></pattern></defs><rect x="0" y="0" width="600" height="200" fill="#fff"/><text x="300" y="18.6" font-family="'Courier New', Courier, monospace" font-size="13" text-anchor="middle"   fill="#000">struct Point { int x; int y; char tag; };</text><rect x="100" y="40" width="120" height="50" rx="5" fill="#dcdcdc" stroke="#000" stroke-width="1.4"/><text x="160.0" y="69.4" font-family="'Times New Roman', Times, serif" font-size="12.5" text-anchor="middle"   fill="#000">x  (4 bytes)</text><rect x="220" y="40" width="120" height="50" rx="5" fill="#f2f2f2" stroke="#000" stroke-width="1.4"/><text x="280.0" y="69.4" font-family="'Times New Roman', Times, serif" font-size="12.5" text-anchor="middle"   fill="#000">y  (4 bytes)</text><rect x="340" y="40" width="30" height="50" rx="5" fill="#dcdcdc" stroke="#000" stroke-width="1.4"/><text x="355.0" y="68.7" font-family="'Times New Roman', Times, serif" font-size="10.5" text-anchor="middle"   fill="#000">tag</text><rect x="370" y="40" width="130" height="50" rx="5" fill="url(#hatch)" stroke="#000" stroke-width="1.4"/><text x="435.0" y="68.8" font-family="'Times New Roman', Times, serif" font-size="11" text-anchor="middle"   fill="#000">padding (3 bytes)</text><text x="300" y="124.2" font-family="'Times New Roman', Times, serif" font-size="12" text-anchor="middle"  font-style="italic" fill="#000">sizeof(Point) = 12, not 9.   The compiler adds padding so the next</text><text x="300" y="144.2" font-family="'Times New Roman', Times, serif" font-size="12" text-anchor="middle"  font-style="italic" fill="#000">item starts at an address the CPU likes. Order affects size!</text></svg>