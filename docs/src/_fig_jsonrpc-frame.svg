<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="100%" role="img"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker><marker id="ar2" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#000" stroke-width="1"/></pattern><pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#000"/></pattern></defs><rect x="0" y="0" width="600" height="200" fill="#fff"/><text x="300" y="18.6" font-family="'Times New Roman', Times, serif" font-size="13" text-anchor="middle" font-weight="bold"  fill="#000">One LSP message on the wire</text><rect x="40" y="34" width="520" height="38" rx="5" fill="#dcdcdc" stroke="#000" stroke-width="1.4"/><text x="300.0" y="57.5" font-family="'Courier New', Courier, monospace" font-size="13" text-anchor="middle"   fill="#000">Content-Length: 52\r\n\r\n</text><rect x="40" y="72" width="520" height="62" rx="5" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="300.0" y="99.8" font-family="'Courier New', Courier, monospace" font-size="12.5" text-anchor="middle"   fill="#000">{&quot;jsonrpc&quot;:&quot;2.0&quot;,&quot;id&quot;:7,&quot;method&quot;:&quot;textDocument/hover&quot;,</text><text x="300.0" y="115.0" font-family="'Courier New', Courier, monospace" font-size="12.5" text-anchor="middle"   fill="#000"> &quot;params&quot;:{...}}</text><text x="300" y="162.2" font-family="'Times New Roman', Times, serif" font-size="12" text-anchor="middle"  font-style="italic" fill="#000">Header says how many bytes follow. Then the JSON body.</text><text x="300" y="182.2" font-family="'Times New Roman', Times, serif" font-size="12" text-anchor="middle"  font-style="italic" fill="#000">Without the length, the reader could not tell where one message ends.</text></svg>