<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" width="100%" role="img"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker><marker id="ar2" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#000" stroke-width="1"/></pattern><pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#000"/></pattern></defs><rect x="0" y="0" width="600" height="330" fill="#fff"/><rect x="28" y="12" width="124" height="30" rx="5" fill="#dcdcdc" stroke="#000" stroke-width="1.4"/><text x="90.0" y="31.6" font-family="'Times New Roman', Times, serif" font-size="13" text-anchor="middle" font-weight="bold"  fill="#000">Renderer (app.js)</text><line x1="90" y1="42" x2="90" y2="318" stroke="#000" stroke-width="1" stroke-dasharray="5,4"/><rect x="238" y="12" width="124" height="30" rx="5" fill="#dcdcdc" stroke="#000" stroke-width="1.4"/><text x="300.0" y="31.6" font-family="'Times New Roman', Times, serif" font-size="13" text-anchor="middle" font-weight="bold"  fill="#000">preload.js</text><line x1="300" y1="42" x2="300" y2="318" stroke="#000" stroke-width="1" stroke-dasharray="5,4"/><rect x="448" y="12" width="124" height="30" rx="5" fill="#dcdcdc" stroke="#000" stroke-width="1.4"/><text x="510.0" y="31.6" font-family="'Times New Roman', Times, serif" font-size="13" text-anchor="middle" font-weight="bold"  fill="#000">Main (main.js)</text><line x1="510" y1="42" x2="510" y2="318" stroke="#000" stroke-width="1" stroke-dasharray="5,4"/><line x1="90" y1="80" x2="300" y2="80" stroke="#000" stroke-width="1.4" marker-end="url(#ar)"/><text x="195.0" y="74.8" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="middle"   fill="#000">nova.read(path)</text><line x1="300" y1="108" x2="510" y2="108" stroke="#000" stroke-width="1.4" marker-end="url(#ar)"/><text x="405.0" y="102.8" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="middle"   fill="#000">ipcRenderer.invoke(&#x27;fs:read&#x27;, path)</text><rect x="425" y="122" width="170" height="26" rx="5" fill="#f2f2f2" stroke="#000" stroke-width="1.4"/><text x="510.0" y="138.8" font-family="'Times New Roman', Times, serif" font-size="11" text-anchor="middle"   fill="#000">fs.readFile(...)  (disk)</text><line x1="510" y1="164" x2="300" y2="164" stroke="#000" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#ar)"/><text x="405.0" y="158.8" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="middle"   fill="#000">{ text: &#x27;...&#x27; }</text><line x1="300" y1="192" x2="90" y2="192" stroke="#000" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#ar)"/><text x="195.0" y="186.8" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="middle"   fill="#000">Promise resolves with the file text</text><text x="300" y="244.4" font-family="'Times New Roman', Times, serif" font-size="12.5" text-anchor="middle"  font-style="italic" fill="#000">Why this detour?  The window (renderer) runs web content, which could be unsafe.</text><text x="300" y="264.4" font-family="'Times New Roman', Times, serif" font-size="12.5" text-anchor="middle"  font-style="italic" fill="#000">It is not allowed to touch your disk directly. Only the main process can,</text><text x="300" y="284.4" font-family="'Times New Roman', Times, serif" font-size="12.5" text-anchor="middle"  font-style="italic" fill="#000">and preload.js decides exactly which doors are open.</text></svg>