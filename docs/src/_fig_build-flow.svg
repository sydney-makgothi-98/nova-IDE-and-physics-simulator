<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 470" width="100%" role="img"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker><marker id="ar2" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#000" stroke-width="1"/></pattern><pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#000"/></pattern></defs><rect x="0" y="0" width="600" height="470" fill="#fff"/><rect x="160" y="8" width="280" height="38" rx="5" fill="#f2f2f2" stroke="#000" stroke-width="1.4"/><text x="300.0" y="31.6" font-family="'Times New Roman', Times, serif" font-size="13" text-anchor="middle"   fill="#000">You press Run  (Shift+F10)</text><line x1="300" y1="46" x2="300" y2="60" stroke="#000" stroke-width="1.4" marker-end="url(#ar)"/><rect x="160" y="60" width="280" height="38" rx="5" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="300.0" y="83.5" font-family="'Times New Roman', Times, serif" font-size="13" text-anchor="middle"   fill="#000">Save all changed files</text><line x1="300" y1="98" x2="300" y2="112" stroke="#000" stroke-width="1.4" marker-end="url(#ar)"/><rect x="180" y="112" width="240" height="38" rx="5" fill="#dcdcdc" stroke="#000" stroke-width="1.4"/><text x="300.0" y="135.6" font-family="'Times New Roman', Times, serif" font-size="13" text-anchor="middle" font-weight="bold"  fill="#000">CMake project?</text><text x="450" y="134.8" font-family="'Times New Roman', Times, serif" font-size="11" text-anchor="start"  font-style="italic" fill="#000">no → g++ file.cpp -o file.exe</text><line x1="420" y1="131" x2="440" y2="131" stroke="#000" stroke-width="1.4" stroke-dasharray="5,4"/><text x="212" y="170.8" font-family="'Times New Roman', Times, serif" font-size="11" text-anchor="start"  font-style="italic" fill="#000">yes</text><line x1="300" y1="150" x2="300" y2="164" stroke="#000" stroke-width="1.4" marker-end="url(#ar)"/><rect x="160" y="164" width="280" height="38" rx="5" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="300.0" y="187.6" font-family="'Times New Roman', Times, serif" font-size="13" text-anchor="middle"   fill="#000">cmake -S . -B build   (configure)</text><line x1="300" y1="202" x2="300" y2="216" stroke="#000" stroke-width="1.4" marker-end="url(#ar)"/><rect x="160" y="216" width="280" height="38" rx="5" fill="#f2f2f2" stroke="#000" stroke-width="1.4"/><text x="300.0" y="239.6" font-family="'Times New Roman', Times, serif" font-size="13" text-anchor="middle"   fill="#000">cmake --build build   (compile + link)</text><line x1="300" y1="254" x2="300" y2="268" stroke="#000" stroke-width="1.4" marker-end="url(#ar)"/><rect x="160" y="268" width="280" height="38" rx="5" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="300.0" y="291.6" font-family="'Times New Roman', Times, serif" font-size="13" text-anchor="middle"   fill="#000">Find hello.exe in the build folder</text><line x1="300" y1="306" x2="300" y2="320" stroke="#000" stroke-width="1.4" marker-end="url(#ar)"/><rect x="160" y="320" width="280" height="38" rx="5" fill="#f2f2f2" stroke="#000" stroke-width="1.4"/><text x="300.0" y="343.6" font-family="'Times New Roman', Times, serif" font-size="13" text-anchor="middle"   fill="#000">Start the program (spawn)</text><line x1="300" y1="358" x2="300" y2="372" stroke="#000" stroke-width="1.4" marker-end="url(#ar)"/><rect x="160" y="372" width="280" height="38" rx="5" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="300.0" y="395.6" font-family="'Times New Roman', Times, serif" font-size="13" text-anchor="middle"   fill="#000">Stream its output to the Run panel</text><line x1="300" y1="410" x2="300" y2="424" stroke="#000" stroke-width="1.4" marker-end="url(#ar)"/><rect x="160" y="424" width="280" height="38" rx="5" fill="#f2f2f2" stroke="#000" stroke-width="1.4"/><text x="300.0" y="447.6" font-family="'Times New Roman', Times, serif" font-size="13" text-anchor="middle"   fill="#000">Parse errors → squiggles + Problems list</text></svg>