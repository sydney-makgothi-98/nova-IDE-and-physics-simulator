<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" role="img"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker><marker id="ar2" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#000" stroke-width="1"/></pattern><pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#000"/></pattern></defs><rect x="0" y="0" width="600" height="380" fill="#fff"/><text x="16" y="20.0" font-family="'Courier New', Courier, monospace" font-size="11.5" text-anchor="start" font-weight="bold"  fill="#000">[+] NOVA - C Interpreter/</text><text x="44" y="42.0" font-family="'Courier New', Courier, monospace" font-size="11.5" text-anchor="start"   fill="#000">    package.json            project name, scripts, dependencies</text><text x="44" y="64.0" font-family="'Courier New', Courier, monospace" font-size="11.5" text-anchor="start"   fill="#000">    main.js                 MAIN process: window, files, processes, PTY, clangd, gdb</text><text x="44" y="86.0" font-family="'Courier New', Courier, monospace" font-size="11.5" text-anchor="start"   fill="#000">    preload.js              the safe bridge (window.nova)</text><text x="44" y="108.0" font-family="'Courier New', Courier, monospace" font-size="11.5" text-anchor="start"   fill="#000">    launch.js               starts Electron without the Node-mode flag</text><text x="44" y="130.0" font-family="'Courier New', Courier, monospace" font-size="11.5" text-anchor="start"   fill="#000">    Launch NOVA.bat         double-click launcher</text><text x="44" y="152.0" font-family="'Courier New', Courier, monospace" font-size="11.5" text-anchor="start" font-weight="bold"  fill="#000">[+] renderer/</text><text x="72" y="174.0" font-family="'Courier New', Courier, monospace" font-size="11.5" text-anchor="start"   fill="#000">    index.html             the skeleton of the window</text><text x="72" y="196.0" font-family="'Courier New', Courier, monospace" font-size="11.5" text-anchor="start"   fill="#000">    styles.css             all colours and layout</text><text x="72" y="218.0" font-family="'Courier New', Courier, monospace" font-size="11.5" text-anchor="start"   fill="#000">    icons.js               tiny SVG icon set</text><text x="72" y="240.0" font-family="'Courier New', Courier, monospace" font-size="11.5" text-anchor="start"   fill="#000">    app.js                 UI, tabs, tree, build/run, search</text><text x="72" y="262.0" font-family="'Courier New', Courier, monospace" font-size="11.5" text-anchor="start"   fill="#000">    lsp.js                 clangd (language server) client</text><text x="72" y="284.0" font-family="'Courier New', Courier, monospace" font-size="11.5" text-anchor="start"   fill="#000">    debug.js               gdb (debugger) client</text><text x="72" y="306.0" font-family="'Courier New', Courier, monospace" font-size="11.5" text-anchor="start"   fill="#000">    terminal.js            xterm.js terminal</text><text x="44" y="328.0" font-family="'Courier New', Courier, monospace" font-size="11.5" text-anchor="start"   fill="#000">    node_modules/            downloaded libraries (Electron, Monaco, xterm...)</text><text x="44" y="350.0" font-family="'Courier New', Courier, monospace" font-size="11.5" text-anchor="start"   fill="#000">    docs/                    this book</text></svg>