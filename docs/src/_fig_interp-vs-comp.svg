<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" width="100%" role="img"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker><marker id="ar2" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#000" stroke-width="1"/></pattern><pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#000"/></pattern></defs><rect x="0" y="0" width="600" height="330" fill="#fff"/><text x="300" y="22.9" font-family="'Times New Roman', Times, serif" font-size="14" text-anchor="middle" font-weight="bold"  fill="#000">Three ways of turning code into action</text><text x="14" y="62.5" font-family="'Times New Roman', Times, serif" font-size="13" text-anchor="start" font-weight="bold"  fill="#000">Compiler</text><rect x="110" y="40" width="100" height="36" rx="5" fill="#f2f2f2" stroke="#000" stroke-width="1.4"/><text x="160.0" y="62.5" font-family="'Times New Roman', Times, serif" font-size="13" text-anchor="middle"   fill="#000">Source</text><rect x="250" y="40" width="140" height="36" rx="5" fill="#dcdcdc" stroke="#000" stroke-width="1.4"/><text x="320.0" y="54.6" font-family="'Times New Roman', Times, serif" font-size="13" text-anchor="middle"   fill="#000">Translate ALL</text><text x="320.0" y="70.5" font-family="'Times New Roman', Times, serif" font-size="13" text-anchor="middle"   fill="#000">of it once</text><rect x="430" y="40" width="100" height="36" rx="5" fill="#f2f2f2" stroke="#000" stroke-width="1.4"/><text x="480.0" y="54.6" font-family="'Times New Roman', Times, serif" font-size="13" text-anchor="middle"   fill="#000">Program</text><text x="480.0" y="70.5" font-family="'Times New Roman', Times, serif" font-size="13" text-anchor="middle"   fill="#000">file (.exe)</text><line x1="210" y1="58" x2="250" y2="58" stroke="#000" stroke-width="1.4" marker-end="url(#ar)"/><line x1="390" y1="58" x2="430" y2="58" stroke="#000" stroke-width="1.4" marker-end="url(#ar)"/><text x="300" y="98.2" font-family="'Times New Roman', Times, serif" font-size="12" text-anchor="middle"  font-style="italic" fill="#000">Run the file many times, fast.   Examples: C, C++, Rust, Go</text><text x="14" y="172.6" font-family="'Times New Roman', Times, serif" font-size="13" text-anchor="start" font-weight="bold"  fill="#000">Interpreter</text><rect x="110" y="150" width="100" height="36" rx="5" fill="#f2f2f2" stroke="#000" stroke-width="1.4"/><text x="160.0" y="172.6" font-family="'Times New Roman', Times, serif" font-size="13" text-anchor="middle"   fill="#000">Source</text><rect x="250" y="150" width="140" height="36" rx="5" fill="#dcdcdc" stroke="#000" stroke-width="1.4"/><text x="320.0" y="164.6" font-family="'Times New Roman', Times, serif" font-size="13" text-anchor="middle"   fill="#000">Read one line,</text><text x="320.0" y="180.5" font-family="'Times New Roman', Times, serif" font-size="13" text-anchor="middle"   fill="#000">run it, repeat</text><rect x="430" y="150" width="100" height="36" rx="5" fill="#f2f2f2" stroke="#000" stroke-width="1.4"/><text x="480.0" y="164.6" font-family="'Times New Roman', Times, serif" font-size="13" text-anchor="middle"   fill="#000">Result</text><text x="480.0" y="180.5" font-family="'Times New Roman', Times, serif" font-size="13" text-anchor="middle"   fill="#000">appears</text><line x1="210" y1="168" x2="250" y2="168" stroke="#000" stroke-width="1.4" marker-end="url(#ar)"/><line x1="390" y1="168" x2="430" y2="168" stroke="#000" stroke-width="1.4" marker-end="url(#ar)"/><polyline points="320,190 320,206 360,206 360,190" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#ar)"/><text x="300" y="228.2" font-family="'Times New Roman', Times, serif" font-size="12" text-anchor="middle"  font-style="italic" fill="#000">No separate file. Starts instantly.   Examples: Python, Ruby, early JavaScript</text><text x="14" y="282.6" font-family="'Times New Roman', Times, serif" font-size="13" text-anchor="start" font-weight="bold"  fill="#000">Hybrid (JIT)</text><rect x="110" y="260" width="100" height="36" rx="5" fill="#f2f2f2" stroke="#000" stroke-width="1.4"/><text x="160.0" y="282.6" font-family="'Times New Roman', Times, serif" font-size="13" text-anchor="middle"   fill="#000">Source</text><rect x="250" y="260" width="140" height="36" rx="5" fill="#dcdcdc" stroke="#000" stroke-width="1.4"/><text x="320.0" y="274.6" font-family="'Times New Roman', Times, serif" font-size="13" text-anchor="middle"   fill="#000">Interpret first,</text><text x="320.0" y="290.5" font-family="'Times New Roman', Times, serif" font-size="13" text-anchor="middle"   fill="#000">compile hot parts</text><rect x="430" y="260" width="100" height="36" rx="5" fill="#f2f2f2" stroke="#000" stroke-width="1.4"/><text x="480.0" y="274.6" font-family="'Times New Roman', Times, serif" font-size="13" text-anchor="middle"   fill="#000">Fast</text><text x="480.0" y="290.5" font-family="'Times New Roman', Times, serif" font-size="13" text-anchor="middle"   fill="#000">result</text><line x1="210" y1="278" x2="250" y2="278" stroke="#000" stroke-width="1.4" marker-end="url(#ar)"/><line x1="390" y1="278" x2="430" y2="278" stroke="#000" stroke-width="1.4" marker-end="url(#ar)"/><text x="300" y="320.2" font-family="'Times New Roman', Times, serif" font-size="12" text-anchor="middle"  font-style="italic" fill="#000">Best of both.   Examples: JavaScript in Chrome (V8), Java</text></svg>