l="#000">address 0x2008</text><polyline points="390,78 300,78 300,40 135,40 135,50" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#ar)"/><text x="300" y="174.2" font-family="'Times New Roman', Times, serif" font-size="12" text-anchor="middle"  font-style="italic" fill="#000">p does not hold 25. It holds WHERE 25 lives.   *p  means &quot;go there and look&quot;.</text></svg>